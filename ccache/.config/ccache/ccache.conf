# ccache config, linked to both ~/.config/ccache/ccache.conf (used when
# XDG_CONFIG_HOME is set, i.e. from zsh) and, on macOS,
# ~/Library/Preferences/ccache/ccache.conf (used otherwise, e.g. GUI apps).

# Room for several worktrees' worth of objects (default 5G thrashes).
max_size = 30G

# Share cache hits between git worktrees (~/workspace/repo, ~/workspace/repo.branch...):
# absolute paths under base_dir are hashed as relative paths, so the same file
# compiled in two worktrees produces the same hash.
base_dir = ${HOME}/workspace
# Don't hash the build directory into -g (debug info) builds either. Side
# effect: debug info of a cache hit may point at the other worktree's sources.
hash_dir = false
