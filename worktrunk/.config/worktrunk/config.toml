# Worktrunk user config. Docs: `wt config --help`, `wt hook --help`.

# tmux workflow: one tmux session per worktree.
# Inside tmux, the shell running `wt switch` does NOT cd (WORKTRUNK_SWITCH__CD=false
# is exported by ~/.zshrc_config), so the session you leave stays on its
# worktree; this hook opens/creates the destination worktree's session instead.
# Session name = worktree dir name with `.`/`:` replaced (tmux rejects them).
[post-switch]
tmux = """
[ -n "$TMUX" ] || exit 0
# `wt switch` to the worktree you're already in: nothing to do
[ '{{ worktree_path }}' = '{{ base_worktree_path | default('') }}' ] && exit 0
s=$(printf '%s' '{{ worktree_name }}' | tr '.:' '__')
if ! tmux has-session -t "=$s" 2>/dev/null; then
  tmux new-session -d -s "$s" -c '{{ worktree_path }}'
  # Submodules not checked out yet (new worktree): run the update in the new
  # session's shell, in the foreground, so you can watch it finish. Objects are
  # shared with the primary worktree's submodules instead of re-cloned.
  if git -C '{{ worktree_path }}' submodule status 2>/dev/null | grep -q '^-'; then
    tmux send-keys -t "=$s:" "~/.config/worktrunk/scripts/submodule-update-shared '{{ primary_worktree_path }}'" Enter
  fi
fi
tmux switch-client -t "=$s"
"""

# Outside tmux there's no session to show it in: check out the submodules of a
# new worktree in the background (no-op in repos without any).
[post-start]
submodules = """
[ -n "$TMUX" ] || ~/.config/worktrunk/scripts/submodule-update-shared '{{ primary_worktree_path }}'
"""
