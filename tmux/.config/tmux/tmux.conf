# Note: for keybindings to work on MacOS,
# the terminal needs to know how to take Command+Shift
# keybindings and send them to tmux.
# In alacritty, this is done in the alacritty.yml file

# Start from 1
set -g base-index 1

# Colors and things
# No delay for escape key press
set -sg escape-time 0

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Mouse
set -g mouse on

# New session
bind -n M-T new-session

# Previous/next session
bind -n M-> switch-client -n; refresh-client -S
bind -n M-< switch-client -p; refresh-client -S

# New/navigate window
bind -n M-\" new-window -c '#{pane_current_path}'
bind -n M-N previous-window
bind -n M-P next-window


# split panes using | and -
# bind -n M-A split-window -v -c '#{pane_current_path}'
bind -n M-S split-window -v -c '#{pane_current_path}'
bind -n M-V split-window -h -c '#{pane_current_path}'

# switch panes using Alt-arrow without prefix
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Down resize-pane -D 5
bind -n M-: resize-pane -Z

# Use Alt-vim keys without prefix key to switch panes
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# Tmux RESURECT !
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' # auto-saves
set -g @continuum-restore 'on'
#       for vim
set -g @resurrect-strategy-vim 'session'
#       for neovim
set -g @resurrect-strategy-nvim 'session'

# For vim autoread
set-option -g focus-events on

# Theme
set-option -g default-terminal "screen-256color"
set-option -a terminal-features 'xterm-256color:RGB'
# set -g default-terminal "xterm-256color"
# set -as terminal-features ",xterm-256color:RGB"
set-option -g status on
set-option -g status-interval 1
set-option -g status-justify left
set-option -g status-keys vi
set-option -g status-position bottom
set-option -g status-left-length 20
set-option -g status-left "#[fg=green][#S] #[fg=green]• "
set-option -g status-right-length 140
set-option -g status-right-style default
# Dark theme
set -g status-style 'bg=#333333 fg=#5eacd3'
# Light theme
# set -g status-style 'bg=#fad9ca fg=#5eacd3'


# List sessions in the status line, current one highlighted
set -g status-right "#{S:#{?#{==:#{session_name},#{client_session}},#[fg=magenta bold]#{session_name}#[default],#[fg=colour244]#{session_name}#[default]} }"
bind-key -n M-W killw
bind-key -n M-O switch-client -l; refresh-client -S
bind-key -n M-E switch-client -t 'dotfiles'; refresh-client -S
bind-key -n M-R switch-client -t 'notes'; refresh-client -S

# Television (tv) pickers in popups. Channels live in ~/.config/television/cable.
# -EE keeps the popup open if the command fails, so errors stay visible.
#   M-I sessions (sesh: tmux sessions / zoxide / dirs; ctrl-s cycles, ctrl-d kills)
#   M-A windows across all sessions          M-Y worktrunk worktrees / branches
#   M-B git branches (enter = checkout)      M-F live grep -> nvim in new window
#   M-D TODO/FIXME comments -> nvim
bind-key -n M-I display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "tv sesh"
bind-key -n M-A display-popup -E -w 80% -h 75% "tv tmux-windows"
bind-key -n M-Y display-popup -EE -w 80% -h 75% -d "#{pane_current_path}" "tv wt -k 'enter=\"actions:tmux\"'"
bind-key -n M-B display-popup -EE -w 80% -h 75% -d "#{pane_current_path}" "tv git-branch -k 'enter=\"actions:checkout\"'"
bind-key -n M-F display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "tv text -k 'enter=\"actions:tmux_edit\"'"
bind-key -n M-D display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "tv todo-comments -k 'enter=\"actions:tmux_edit\"'"
bind-key -n M-G display-popup -E -w 95% -h 90% -d "#{pane_current_path}" lazygit

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
