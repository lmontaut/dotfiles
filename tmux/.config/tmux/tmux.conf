# Note: for keybindings to work on MacOS,
# the terminal needs to know how to take Command+Shift
# keybindings and send them to tmux.
# In alacritty, this is done in the alacritty.yml file

# Start from 1, keep numbering contiguous when windows close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# No delay for escape key press
set -sg escape-time 0
set -g history-limit 50000
set -g display-time 2000

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Mouse
set -g mouse on

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# New session
bind -n M-T new-session

# Previous/next session
bind -n M-> switch-client -n \; refresh-client -S
bind -n M-< switch-client -p \; refresh-client -S

# New/navigate window
bind -n M-\" new-window -c '#{pane_current_path}'
bind -n M-N previous-window
bind -n M-P next-window
# Jump to window N (Command+N in alacritty must send ESC N)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# split panes using | and -
# bind -n M-A split-window -v -c '#{pane_current_path}'
bind -n M-S split-window -v -c '#{pane_current_path}'
bind -n M-V split-window -h -c '#{pane_current_path}'

# switch panes using Alt-arrow without prefix
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Down resize-pane -D 5
bind -n M-: resize-pane -Z

# Use Alt-vim keys without prefix key to switch panes
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R

# Copy mode: vi keys, v to select, y to yank (to system clipboard via OSC 52)
setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Plugins
set -g @plugin 'tmux-plugins/tpm'
# Tmux RESURECT !
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum' # auto-saves
set -g @continuum-restore 'on'
#       for vim
set -g @resurrect-strategy-vim 'session'
#       for neovim
set -g @resurrect-strategy-nvim 'session'

# Terminal: tmux-256color inside, alacritty (TERM=xterm-256color) outside
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm-256color:RGB:usstyle'
set -g focus-events on                 # for vim autoread
set -g set-clipboard on                # OSC 52 copy to system clipboard
set -g allow-passthrough on            # image previews (tv) inside tmux
set -s extended-keys on

# Window names: Claude Code sets its process title to its version (e.g. 2.1.296)
set -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'

# Agent awareness: a bell (agent done / waiting for input) flags the window
# and its session; plain output only marks the window as active.
setw -g monitor-bell on
setw -g monitor-activity on
set -g bell-action any
set -g activity-action none
set -g visual-bell off
set -g visual-activity off

# Status bar: 2 lines at the bottom
#   line 0: windows of the current session (tabs)
#   line 1: all sessions (current in brackets, alerted ones in red)
set -g status 2
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#2c313a fg=#abb2bf'

# Session name turns yellow while the prefix is pressed
set -g status-left-length 40
set -g status-left "#[fg=#1e2127 bold]#{?client_prefix,#[bg=yellow],#[bg=green]} #S #[default] "
set -g status-right-length 40
set -g status-right "#{?pane_in_mode,#[fg=yellow bold][#{pane_mode}] #[default],}#[fg=colour244]%H:%M "

setw -g window-status-separator ''
setw -g window-status-format ' #I #W#{?window_zoomed_flag, (Z),}#{?window_bell_flag, ●,#{?window_activity_flag, •,}} '
setw -g window-status-current-format ' #I #W#{?window_zoomed_flag, (Z),} '
setw -g window-status-style 'fg=colour244'
setw -g window-status-current-style 'bg=#61afef fg=#1e2127 bold'
setw -g window-status-activity-style 'fg=#abb2bf'
setw -g window-status-bell-style 'fg=#e06c75 bold'

set -g status-format[1] "#[align=left fill=#21252b bg=#21252b fg=colour244]  #{S:#{?#{==:#{session_name},#{client_session}},#[fg=magenta bold][#{session_name}]#[nobold fg=colour244],#{?#{m:*!*,#{session_alerts}},#[fg=#e06c75]#{session_name}●#[fg=colour244],#{session_name}}}  }"

bind-key -n M-W confirm-before -p "kill window #W? (y/n)" kill-window
bind-key -n M-O switch-client -l \; refresh-client -S
bind-key -n M-E switch-client -t 'dotfiles' \; refresh-client -S
bind-key -n M-R switch-client -t 'notes' \; refresh-client -S

# Television (tv) pickers in popups. Channels live in ~/.config/television/cable.
# -EE keeps the popup open if the command fails, so errors stay visible.
#   M-I sessions (sesh: tmux sessions / zoxide / dirs; ctrl-s cycles, ctrl-d kills)
#   M-A windows across all sessions          M-Y worktrunk (enter switch, ctrl-b create)
#   M-B git branches (enter = checkout)      M-F live grep -> nvim in new window
#   M-D TODO/FIXME comments -> nvim
bind-key -n M-I display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "tv sesh"
bind-key -n M-A display-popup -E -w 80% -h 75% "tv tmux-windows"
bind-key -n M-Y display-popup -EE -w 80% -h 75% -d "#{pane_current_path}" "tv wt -k 'enter=\"actions:switch\"'"
bind-key -n M-B display-popup -EE -w 80% -h 75% -d "#{pane_current_path}" "tv git-branch -k 'enter=\"actions:checkout\"'"
bind-key -n M-F display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "tv text -k 'enter=\"actions:tmux_edit\"'"
bind-key -n M-D display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "tv todo-comments -k 'enter=\"actions:tmux_edit\"'"
bind-key -n M-G display-popup -E -w 95% -h 90% -d "#{pane_current_path}" lazygit

# Fork the Claude Code / Codex conversation of the current pane into a new
# window of this session (claude --resume <id> --fork-session / codex fork <id>)
bind-key -n M-C run-shell -b "~/.config/tmux/scripts/fork-agent '#{pane_id}'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
