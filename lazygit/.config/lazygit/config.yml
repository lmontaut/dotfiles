refresher:
  refreshInterval: 1 # File/submodule refresh interval in seconds
  fetchInterval: 180 # In seconds
notARepository: 'skip'
gui:
  scrollHeight: 15 # How many lines are scrolled
  mainPanelSplitMode: 'vertical'
  showFileTree: false
  showIcons: false
  theme:
    activeBorderColor:
      - green
      - bold
    inactiveBorderColor:
      - white
    optionsTextColor:
      - blue
    selectedLineBgColor:
      - '#3e4451'
    selectedRangeBgColor:
      - magenta
    cherryPickedCommitBgColor:
      - cyan
    cherryPickedCommitFgColor:
      - blue
    unstagedChangesColor:
      - red
    defaultFgColor:
      - default
customCommands:
  - key: 'X'
    context: 'localBranches'
    description: 'Push selected branch to a chosen remote'
    loadingText: 'Pushing...'
    prompts:
      - type: 'menuFromCommand'
        title: 'Push to which remote?'
        key: 'Remote'
        command: 'git remote'
    command: 'git push {{.Form.Remote}} {{.SelectedLocalBranch.Name | quote}}'
  - key: '<c-g>'
    context: "global"
    description: "Push HEAD to <remote>:<branch>"
    prompts:
      - type: "menuFromCommand"
        title: "Remote"
        key: "Remote"
        command: "git remote"
        filter: "(?P<name>.+)"
        valueFormat: "{{ .name }}"
        labelFormat: "{{ .name }}"
      - type: "input"
        title: "Remote branch"
        key: "Branch"
        initialValue: "{{.CheckedOutBranch.UpstreamBranch}}"
    command: "git push {{.Form.Remote | quote}} HEAD:{{.Form.Branch | quote}}"
    loadingText: "Pushing..."
    output: log
